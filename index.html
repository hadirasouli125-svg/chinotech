<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChinoTech | لوازم خودروهای چینی</title>
<meta name="description" content="ChinoTech - فروش لوازم و قطعات خودروهای چینی">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#f5b800;
  --gold2:#ffd45a;
  --black:#080808;
  --dark:#111;
  --gray:#777;
  --light:#f5f6f8;
  --white:#fff;
}

html{scroll-behavior:smooth}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:var(--light);
  color:#171717;
  line-height:1.8;
}

a{text-decoration:none;color:inherit}

.container{
  width:min(1180px,92%);
  margin:auto;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,8,8,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:29px;
  font-weight:900;
  color:var(--gold);
  letter-spacing:.5px;
}

.logo span{color:white}

nav{
  display:flex;
  align-items:center;
  gap:28px;
}

nav a{
  color:#ddd;
  font-size:14px;
  transition:.25s;
}

nav a:hover{
  color:var(--gold);
}

.nav-btn{
  background:var(--gold);
  color:#111;
  padding:9px 18px;
  border-radius:9px;
  font-weight:bold;
}

/* HERO */

.hero{
  position:relative;
  min-height:610px;
  display:flex;
  align-items:center;
  overflow:hidden;
  color:white;
  background:
    radial-gradient(circle at 80% 30%,rgba(245,184,0,.18),transparent 30%),
    linear-gradient(135deg,#050505,#171717 55%,#090909);
}

.hero:before{
  content:"";
  position:absolute;
  width:450px;
  height:450px;
  border:1px solid rgba(245,184,0,.12);
  border-radius:50%;
  left:-160px;
  bottom:-220px;
}

.hero-content{
  position:relative;
  max-width:720px;
  padding:80px 0;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(245,184,0,.12);
  border:1px solid rgba(245,184,0,.35);
  color:var(--gold2);
  padding:7px 16px;
  border-radius:50px;
  font-size:13px;
  margin-bottom:22px;
}

.hero h1{
  font-size:clamp(40px,7vw,70px);
  line-height:1.2;
  margin-bottom:20px;
  font-weight:900;
}

.hero h1 span{color:var(--gold)}

.hero p{
  color:#c7c7c7;
  font-size:18px;
  max-width:620px;
  margin-bottom:30px;
}

.buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:13px 25px;
  border-radius:11px;
  font-weight:bold;
  transition:.25s;
}

.btn-primary{
  background:var(--gold);
  color:#111;
}

.btn-primary:hover{
  transform:translateY(-3px);
  background:var(--gold2);
}

.btn-outline{
  border:1px solid #555;
  color:white;
}

.btn-outline:hover{
  border-color:var(--gold);
  color:var(--gold);
}

/* STATS */

.stats{
  margin-top:-45px;
  position:relative;
  z-index:5;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.09);
}

.stat strong{
  display:block;
  font-size:25px;
  color:#111;
}

.stat span{
  color:var(--gray);
  font-size:13px;
}

/* SECTION */

section{padding:80px 0}

.section-title{
  text-align:center;
  margin-bottom:42px;
}

.section-title .small{
  color:var(--gold);
  font-size:13px;
  font-weight:bold;
}

.section-title h2{
  font-size:34px;
  margin:5px 0;
}

.section-title p{
  color:var(--gray);
  font-size:14px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #eee;
  box-shadow:0 7px 25px rgba(0,0,0,.06);
  transition:.3s;
}

  transform:translateY(-7px);
  box-shadow:0
